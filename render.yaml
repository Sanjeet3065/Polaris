services:
  # 1. Node.js Express & Real-time WebSockets API Service
  - type: web
    name: polaris-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://polaris-twin.vercel.app,http://localhost:5173
      - key: WEBSOCKET_ENABLED
        value: "true"
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://postgres.ftmerrdajglkergcpfxp:polarios%40llama9999@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?schema=public

  # 2. Python FastAPI AI Predictive Maintenance Microservice
  - type: web
    name: polaris-ai-service
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.9
