# ============================================================
# POLARIS Cloud Deployment Blueprint (Render.com)
# Polar Operations & Logistics Automated Remote Intelligence System
# SIH 2026 - Problem Statement ID: SIH26060
# ============================================================

databases:
  # 1. Managed PostgreSQL Database Tier
  - name: polaris-db
    databaseName: polaris_db
    user: polaris_admin
    plan: free
    region: oregon

services:
  # 2. Node.js Express & Real-time WebSockets API Service
  - type: web
    name: polaris-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma db push --skip-generate && npx prisma generate && npm run db:seed && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://polaris-twin.vercel.app,http://localhost:5173
      - key: WEBSOCKET_ENABLED
        value: "true"
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: polaris-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: polaris-ai-service
          property: host

  # 3. Python FastAPI AI Predictive Maintenance Microservice
  - type: web
    name: polaris-ai-service
    runtime: python
    plan: free
    region: oregon
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.9
