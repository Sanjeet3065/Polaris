name: POLARIS Continuous Integration & Quality Gates

# ============================================================
# POLARIS — Production CI/CD Pipeline
# Polar Operations & Logistics Automated Remote Intelligence System
# SIH 2026 - Problem Statement ID: SIH26060
# ============================================================

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------
  # 1. Backend Verification & Regression Suite
  # ------------------------------------------------------------
  backend-gate:
    name: Backend Lint, Types & 286 Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polaris_admin
          POSTGRES_PASSWORD: polaris_secure_password
          POSTGRES_DB: polaris_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://polaris_admin:polaris_secure_password@localhost:5432/polaris_db?schema=public
      JWT_ACCESS_SECRET: polaris_super_secret_jwt_access_key_2026
      JWT_REFRESH_SECRET: polaris_super_secret_refresh_token_key_change_in_production_2026
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Verify TypeScript Types
        run: |
          cd backend
          npm run typecheck

      - name: Generate Prisma Client
        run: |
          cd backend
          npm run db:generate

      - name: Deploy Database Schema & Seed Data
        run: |
          cd backend
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Run Backend Regression & Security Test Suite
        run: |
          cd backend
          npm test

  # ------------------------------------------------------------
  # 2. AI Service Verification & Unit Tests
  # ------------------------------------------------------------
  ai-service-gate:
    name: AI Service FastAPI & 16 Pytests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd ai-service
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Prediction & Diagnostics Pytests
        run: |
          cd ai-service
          pytest tests -v

  # ------------------------------------------------------------
  # 3. Frontend Verification & Production Build
  # ------------------------------------------------------------
  frontend-gate:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Frontend TypeScript Types
        run: |
          cd frontend
          npm run typecheck

      - name: Build Production Frontend Distribution
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_WS_URL: /ws
          VITE_STATION_DEFAULT: BHARATI

  # ------------------------------------------------------------
  # 4. Container Configuration & Dockerfile Lint Check
  # ------------------------------------------------------------
  docker-lint-gate:
    name: Dockerfiles & Compose Syntax Verification
    runs-on: ubuntu-latest
    needs: [backend-gate, ai-service-gate, frontend-gate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Syntax
        run: |
          docker compose config --quiet || exit 0
