version: "3.8"

# ============================================================
# POLARIS — Dedicated Production Docker Compose Stack
# Polar Operations & Logistics Automated Remote Intelligence System
# SIH 2026 - Problem Statement ID: SIH26060
# ============================================================

services:
  # ------------------------------------------------------------
  # 1. PostgreSQL 16 Enterprise Relational & Time-Series Store
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: polaris_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polaris_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided in production}
      POSTGRES_DB: ${POSTGRES_DB:-polaris_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polaris_admin} -d ${POSTGRES_DB:-polaris_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - polaris_prod_network

  # ------------------------------------------------------------
  # 2. Python FastAPI Predictive Analytics & Diagnostics Microservice
  # ------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: polaris_prod_ai_service
    restart: always
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - polaris_prod_network

  # ------------------------------------------------------------
  # 3. Node.js + Express API Backend & Persistent WebSocket Engine
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polaris_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-polaris_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polaris_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT access secret must be provided in production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT refresh secret must be provided in production}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: ${CORS_ORIGINS:?CORS origins must be configured in production}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-5000}
      WEBSOCKET_ENABLED: "true"
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: ${SEED_ON_STARTUP:-false}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - polaris_prod_network

  # ------------------------------------------------------------
  # 4. React + Vite Static Frontend Application (Nginx Alpine)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
        VITE_STATION_DEFAULT: ${VITE_STATION_DEFAULT:-BHARATI}
    container_name: polaris_prod_frontend
    restart: always
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - polaris_prod_network

networks:
  polaris_prod_network:
    name: polaris_prod_network
    driver: bridge

volumes:
  postgres_prod_data:
    name: polaris_postgres_prod_data
    driver: local
